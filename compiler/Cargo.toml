[package]
name = "candor"
version = "0.1.0"
edition = "2021"
autobenches = false
description = "Candor Bet 5 validation prototype: lexer, AST and parser (Stage 1)"

[lib]
name = "candor"
path = "src/lib.rs"

[[bin]]
name = "candor"
path = "src/main.rs"

[[bin]]
name = "p20-gen"
path = "benches/p20_gen.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cranelift-codegen = "=0.132.3"
cranelift-frontend = "=0.132.3"
cranelift-module = "=0.132.3"
cranelift-jit = "=0.132.3"
libc = "0.2"
cranelift-object = "=0.132.3"
cranelift-native = "=0.132.3"
toml = "1"
stacker = "0.1.25"

[[bench]]
name = "p20"
harness = false

[dev-dependencies]
wasmi = "1.1.0"

# Light optimization for test builds (#142c). The suite's floor is interpreted
# Candor (self-host gates, the wasm/float differentials, the reclamation gate),
# and opt-level 1 cuts the full nextest suite 631s -> 88s (measured 2026-08-18)
# for ~28s of extra candor-lib compile per edit-test cycle. debug-assertions
# stay on (profile default), so the #141 debug tripwires still run everywhere.
# The earlier decision to skip this (MEMORY 2026-07-12) predates the
# interpreted-test floor growing past the compile cost.
[profile.test]
opt-level = 1
