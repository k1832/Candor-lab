# CI for the published Candor 0.x preview (installed by dist/seed.sh as
# .github/workflows/ci.yml — edit it in the lab, never here).
#
# This is deliberately the USER-JOURNEY check, not the lab's deep gate: the
# preview ships no tests/ (the five-engine differential suites, the self-host
# oracle, and the fixtures live in the lab), so this repo verifies exactly what
# a visitor does — build the toolchain, run the examples, run the stdlib — plus
# a weekly scheduled run to catch bit-rot against newer stable Rust toolchains.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch toolchain bit-rot
jobs:
  user-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: toolchain
      - name: Build the toolchain
        run: cargo build --release
        working-directory: toolchain
      - name: Run the examples
        working-directory: toolchain
        run: |
          set -eu
          C=./target/release/candor
          [ "$($C run ../examples/01_hello.cnr | tail -1)" = "42" ]
          [ "$($C run ../examples/08_ordering.cnr | tail -1)" = "18" ]
          [ "$($C run ../examples/11_wasm_interp.cnr | tail -1)" = "42" ]
          [ "$($C run ../examples/13_json.cnr | tail -1)" = "42" ]
          echo "examples OK"
      - name: Run the stdlib seed
        working-directory: toolchain
        run: |
          [ "$(./target/release/candor run ../stdlib | tail -1)" = "380" ]
          echo "stdlib OK (380)"
      - name: HTTP server serves (compiled)
        working-directory: examples/12_http_server
        run: |
          set -eu
          ../../toolchain/target/release/candor compile main.cnr -o httpd
          ./httpd & PID=$!
          sleep 1
          # curl with retries: the raw /dev/tcp client proved racy against the
          # server's close (one flaky RST on a runner); the server budgets 8
          # requests, so retrying is safe. -si includes the status line.
          BODY=""
          for i in 1 2 3; do
            BODY=$(curl -si --max-time 5 http://127.0.0.1:8080/hello.txt || true)
            echo "$BODY" | grep -q "200 OK" && break
            sleep 1
          done
          echo "$BODY" | grep -q "200 OK"
          echo "$BODY" | grep -q "Hello, Candor!"
          # let the server finish its request budget or kill it; either is fine
          kill "$PID" 2>/dev/null || true
          echo "http OK"
      - name: REST service create/read cycle (compiled, persisted)
        working-directory: examples/14_rest_api
        run: |
          set -eu
          ../../toolchain/target/release/candor compile main.cnr -o restd --release
          rm -f records.json
          ./restd & PID=$!
          sleep 1
          # create -> {"id":1}, read it back, then a clean shutdown
          BODY=""
          for i in 1 2 3; do
            BODY=$(curl -s --max-time 5 -d '{"title":"ci probe","n":42}' http://127.0.0.1:8081/records || true)
            [ "$BODY" = '{"id":1}' ] && break
            sleep 1
          done
          [ "$BODY" = '{"id":1}' ]
          [ "$(curl -s --max-time 5 http://127.0.0.1:8081/records/1)" = '{"title":"ci probe","n":42}' ]
          curl -s --max-time 5 -X POST http://127.0.0.1:8081/shutdown >/dev/null
          wait "$PID" || true
          # the snapshot survives a restart
          ./restd & PID=$!
          sleep 1
          [ "$(curl -s --max-time 5 http://127.0.0.1:8081/records/1)" = '{"title":"ci probe","n":42}' ]
          curl -s --max-time 5 -X POST http://127.0.0.1:8081/shutdown >/dev/null
          wait "$PID" || true
          echo "rest OK"
      - name: Ray tracer renders (compiled, deterministic bytes)
        working-directory: examples
        run: |
          set -eu
          ../toolchain/target/release/candor compile 15_raytracer.cnr -o rt --release
          code=0; ./rt || code=$?
          [ "$code" = "42" ]
          [ -f render.ppm ]
          # IEEE-754 f64 + the correctly-rounded sqrt intrinsic are bit-exact
          # on x86-64, so the 921,615-byte image is the SAME on every run.
          echo "55b56d894388f60f148eef10f3d78094f0cf611132b9f80936c60a04c76aedc3  render.ppm" | sha256sum -c -
          echo "raytracer OK"
      - name: Compile an example to native
        working-directory: toolchain
        run: |
          ./target/release/candor compile ../examples/01_hello.cnr -o /tmp/hello
          code=0; /tmp/hello || code=$?
          [ "$code" = "42" ]
          echo "native OK"
